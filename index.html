<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <meta name="robots" content="noindex, nofollow">
  <title>We'll Be Back Soon | EU.C.C.A</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101827;
      --panel: rgba(24, 37, 56, .82);
      --text: #f5f7fb;
      --muted: #aebbd0;
      --accent: #62d6c5;
      --accent-2: #d9b879;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 15%, rgba(98,214,197,.13), transparent 38%),
        radial-gradient(ellipse at 85% 85%, rgba(217,184,121,.10), transparent 35%),
        var(--bg);
      font-family: Inter, "Segoe UI", Tahoma, Arial, sans-serif;
    }
    .card {
      width: min(100%, 720px);
      padding: clamp(30px, 6vw, 62px);
      text-align: center;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 28px 90px rgba(0,0,0,.34);
      backdrop-filter: blur(14px);
    }
    .logo-container {
      max-width: 240px;
      margin: 0 auto 28px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
    }
    .eyebrow {
      margin: 0 0 13px;
      color: var(--accent-2);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 48px);
      line-height: 1.12;
      letter-spacing: -.04em;
    }
    .english-copy {
      max-width: 490px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 34px;
      padding: 10px 15px;
      color: #d8e5ed;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      font-size: 12px;
      letter-spacing: .04em;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }
    footer {
      margin-top: 25px;
      color: #78879d;
      font-size: 11px;
      letter-spacing: .08em;
    }
    @media (max-width: 480px) {
      .card { border-radius: 22px; }
      .logo-container { max-width: 180px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo-container">
      <img src="EUCCA.webp" alt="EU.C.C.A Logo">
    </div>

    <section lang="en">
      <p class="eyebrow">A little update in progress</p>
      <h1>We'll Be Back Soon</h1>
      <p class="english-copy">
        We're making a few improvements to give you a better experience.
        Our website is temporarily unavailable while we work behind the scenes.
        Thank you for your patience.
      </p>
    </section>

    <div class="status"><span class="dot"></span> Maintenance in progress</div>
    <footer>THANK YOU FOR YOUR UNDERSTANDING</footer>
  </main>
</body>
</html>
